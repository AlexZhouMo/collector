[package]
name = "collector"
version = "0.1.7"
description = "Collector - local asset manager"
authors = ["zhoumo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
# 只开 deflate/deflate64：漫画卷（Vol_XX.zip）由本应用归档或常见 cbz，均为 stored/deflate。
# 关掉默认的 bzip2/zstd/lzma/xz/aes，省去三个 C 库的编译与体积。
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
# 只开实际读写的格式（漫画页/封面：jpg/png/webp/bmp/gif），关掉 AVIF(rav1e)/EXR/TIFF/HDR 等。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "rayon"] }
rayon = "1"
base64 = "0.22"
filetime = "0.2"
ureq = { version = "2", features = ["tls"] }
urlencoding = "2"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
