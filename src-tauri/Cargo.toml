[package]
name = "collector"
version = "0.1.2"
description = "Collector - local asset manager"
authors = ["zhoumo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
zip = "2"
image = "0.25"
rayon = "1"
base64 = "0.22"
filetime = "0.2"
tiny_http = "0.12"
ureq = { version = "2", features = ["tls"] }
urlencoding = "2"
encoding_rs = "0.8"
regex = "1"
libmpv2 = "6"

# 阶段 0.2 探索验证：libmpv --wid 嵌入 Tauri 原生 NSView。
# 版本与 tauri 2.11 传递依赖对齐（objc2 0.6 / objc2-app-kit 0.3），避免多版本冲突。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSView",
    "NSWindow",
    "NSResponder",
    "NSGraphics",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
