name: Build Windows Installer
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend deps
        run: npm ci
      # externalBin 要求 bin/ffmpeg-<target>.exe 在打包前就位；任何打包 CI 都必须前置此步。
      - name: Fetch ffmpeg sidecar
        run: node scripts/fetch-ffmpeg.mjs --target x86_64-pc-windows-msvc
      - name: Build Tauri (NSIS)
        run: npm run tauri build -- --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Collector-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
